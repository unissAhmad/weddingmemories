# FREE Blueprint (for testing): one free web service runs both the API and the worker.
# The website is hosted on Netlify (netlify.toml), which proxies /api/* to this service.
#
# Free-plan limits: the service sleeps after 15 minutes without traffic and takes ~50 s to
# wake; photo processing pauses while it sleeps; 512 MB memory is shared by API and worker.
# Before the wedding, switch to render.production.yaml (paid, always on).
#
# Values marked `sync: false` are prompted for in the dashboard on first deploy.

services:
  - type: web
    name: wm-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npx --yes pnpm@10.34.5 install --frozen-lockfile --production=false &&
      npx --yes pnpm@10.34.5 db:generate &&
      npx --yes pnpm@10.34.5 --filter @wm/api --filter @wm/worker build &&
      npx --yes pnpm@10.34.5 db:deploy
    startCommand: node tools/start-all.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled URL (host contains "-pooler")
      - key: DIRECT_URL
        sync: false # same Neon URL without "-pooler" (used by migrations)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: JWT_SECRET_GUEST
        generateValue: true
      - key: JWT_SECRET_ADMIN
        generateValue: true # also encrypts TOTP secrets: rotating it forces 2FA re-enrolment
      - key: OTP_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false # optional while testing: without it, codes/emails only appear in the logs
      - key: MAIL_FROM
        sync: false
      - key: WEB_ORIGIN
        sync: false # your Netlify URL, e.g. https://aisha-omar.netlify.app
      - key: PUBLIC_WEB_URL
        sync: false # same Netlify URL (used in QR codes and emails)
      - key: TRUST_PROXY
        value: '2' # Netlify proxy + Render proxy
      - key: MAX_UPLOAD_MB
        value: '25'
      - key: WORKER_CONCURRENCY
        value: '1' # 512 MB shared with the API
